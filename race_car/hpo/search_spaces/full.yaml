# Full SAC search space.  It extends `small.yaml` with data-collection,
# optimisation-frequency, exploration and network-size hyperparameters.
#
# The ranges follow the recommendations and SAC space in Eimer et al.,
# "Hyperparameters in Reinforcement Learning and How To Tune Them"
# (ICML 2023), adapted to the configuration names of leap-c's SAC-ZOP trainer.
#
# `lr_alpha` is listed as an additional target of the learning-rate parameter.
# If you want to tune it independently, split `lr` into separate entries.

lr:
  type: loguniform
  low: 1.0e-6
  high: 1.0e-2
  targets: [lr_q, lr_pi, lr_alpha]

gamma:
  type: uniform
  low: 0.90
  high: 0.9999

tau:
  type: loguniform
  low: 1.0e-3
  high: 1.0

batch_size:
  type: categorical
  choices: [32, 64, 128, 256]

update_freq:
  type: categorical
  choices: [1, 2, 4, 8]

train_start:
  type: int
  low: 500
  high: 5000
  step: 500

init_alpha:
  type: loguniform
  low: 1.0e-4
  high: 1.0e-1

num_critics:
  type: categorical
  choices: [2, 4]

critic_mlp.hidden_dims:
  type: categorical
  choices: ["64x64", "64x64x64", "128x128", "128x128x128"]
  values:
    "64x64": [64, 64]
    "64x64x64": [64, 64, 64]
    "128x128": [128, 128]
    "128x128x128": [128, 128, 128]

# The default actor is a linear head (`null`), which is a strong inductive bias
# when learning residual MPC parameters.  `linear` maps to an empty hidden-dim
# tuple, which leap-c treats as a linear parameter head.
actor.mlp.hidden_dims:
  type: categorical
  choices: ["linear", "64", "64x64"]
  values:
    "linear": []
    "64": [64]
    "64x64": [64, 64]
