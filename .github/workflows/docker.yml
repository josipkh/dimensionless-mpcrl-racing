name: Docker

on:
  push:
  pull_request:

jobs:
  container-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check shell script syntax
        shell: bash
        run: bash -n docker/reproduce.sh docker/scripts/*.sh

      - name: Validate Compose configuration
        run: docker compose -f docker/compose.yaml config -q

      - name: Run one-command reproduction (tests)
        run: ./docker/reproduce.sh test

  windows-validate:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell reproduction script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/docker/reproduce.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Check script is discoverable and parameterized
        shell: pwsh
        run: |
          Get-Command ./docker/reproduce.ps1 | Out-Null
          $cmd = Get-Command ./docker/reproduce.ps1 -Syntax
          if (-not $cmd) { throw "Could not read reproduce.ps1 syntax" }
          $cmd

